<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Shader | Operator Console</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --card-bg: rgba(0, 20, 0, 0.6);
      --card-border: rgba(0, 255, 65, 0.15);
      --green: #00ff41;
      --green-dim: #00cc33;
      --green-glow: 0 0 20px rgba(0, 255, 65, 0.3);
      --red: #ff0040;
      --yellow: #ffcc00;
      --text: #b0ffb0;
      --text-dim: #4a7a4a;
      --font: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    #matrix-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      object-fit: cover;
      opacity: 0.7;
    }

    /* Auth Modal */
    .auth-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .auth-overlay.hidden { display: none; }

    .auth-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .auth-box h2 {
      color: var(--green);
      font-size: 18px;
      margin-bottom: 8px;
    }
    .auth-box p {
      color: var(--text-dim);
      font-size: 12px;
      margin-bottom: 24px;
    }
    .auth-box input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--green);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
    }
    .auth-box input:focus { border-color: var(--green); }
    .auth-box button {
      width: 100%;
      padding: 12px;
      background: rgba(0, 255, 65, 0.15);
      border: 1px solid var(--green);
      border-radius: 6px;
      color: var(--green);
      font-family: var(--font);
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .auth-box button:hover { background: rgba(0, 255, 65, 0.3); }
    .auth-error {
      color: var(--red);
      font-size: 12px;
      margin-top: 12px;
      min-height: 18px;
    }

    /* Dashboard Layout */
    .dashboard {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    .dashboard.hidden { display: none; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    header h1 {
      color: var(--green);
      font-size: 20px;
      font-weight: 700;
      text-shadow: var(--green-glow);
    }
    header h1 span { color: var(--text-dim); font-weight: 400; }

    .header-actions { display: flex; gap: 8px; }
    .btn-icon {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 12px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-icon:hover { color: var(--green); border-color: var(--green); }

    /* Grid */
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-top { grid-template-columns: 2fr 1fr; }

    /* Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 20px;
    }
    .card-title {
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
    }

    /* Metric Cards */
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .metric {
      text-align: center;
      padding: 12px 8px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
    }
    .metric-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--green);
      text-shadow: var(--green-glow);
      line-height: 1.2;
    }
    .metric-label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* Funnel */
    .funnel-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .funnel-row:last-child { margin-bottom: 0; }
    .funnel-label {
      width: 100px;
      font-size: 11px;
      color: var(--text-dim);
      text-align: right;
      flex-shrink: 0;
    }
    .funnel-bar-bg {
      flex: 1;
      height: 24px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .funnel-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--green-dim));
      border-radius: 4px;
      transition: width 0.8s ease;
      min-width: 2px;
    }
    .funnel-count {
      width: 60px;
      font-size: 13px;
      font-weight: 600;
      color: var(--green);
      flex-shrink: 0;
    }
    .funnel-conversion {
      text-align: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
      font-size: 12px;
      color: var(--text-dim);
    }
    .funnel-conversion strong {
      color: var(--green);
      font-size: 16px;
    }

    /* Chart */
    .chart-wrap {
      position: relative;
      height: 260px;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      max-height: 300px;
      overflow-y: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th {
      text-align: left;
      padding: 8px 10px;
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 10px;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      background: rgba(0, 10, 0, 0.95);
    }
    td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(0, 255, 65, 0.05);
      color: var(--text);
    }
    tr:hover td { background: rgba(0, 255, 65, 0.03); }
    .empty-state {
      text-align: center;
      padding: 32px;
      color: var(--text-dim);
      font-size: 12px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-dim);
    }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--card-border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .grid-2, .grid-top { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      header { flex-direction: column; gap: 12px; align-items: flex-start; }
      .metric-value { font-size: 22px; }
      .funnel-label { width: 70px; font-size: 10px; }
    }
  </style>
</head>
<body>
<video id="matrix-bg" autoplay muted loop playsinline>
  <source src="../assets/shader-bg-cropped.mp4" type="video/mp4">
</video>

<!-- Auth Modal -->
<div class="auth-overlay" id="auth-overlay">
  <div class="auth-box">
    <h2>OPERATOR CONSOLE</h2>
    <p>Matrix Shader Analytics</p>
    <input type="password" id="auth-password" placeholder="Enter password" autofocus>
    <button id="auth-submit">Authenticate</button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard hidden" id="dashboard">
  <header>
    <h1>OPERATOR CONSOLE <span>| matrixshader.com</span></h1>
    <div class="header-actions">
      <button class="btn-icon" id="btn-refresh" title="Refresh data">Refresh</button>
      <button class="btn-icon" id="btn-logout" title="Logout">Logout</button>
    </div>
  </header>

  <!-- Top row: Metrics + Funnel -->
  <div class="grid grid-top" style="margin-bottom: 16px;">
    <div class="card">
      <div class="card-title">Key Metrics</div>
      <div class="metrics" id="metrics">
        <div class="loading"><div class="spinner"></div><br>Loading...</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Conversion Funnel</div>
      <div id="funnel">
        <div class="loading"><div class="spinner"></div><br>Loading...</div>
      </div>
    </div>
  </div>

  <!-- Chart row -->
  <div class="card" style="margin-bottom: 16px;">
    <div class="card-title">30-Day Traffic</div>
    <div class="chart-wrap">
      <canvas id="traffic-chart"></canvas>
    </div>
  </div>

  <!-- Tables row -->
  <div class="grid grid-2">
    <div class="card">
      <div class="card-title">Subscribers</div>
      <div class="table-wrap" id="subscribers-table">
        <div class="loading"><div class="spinner"></div><br>Loading...</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Licenses</div>
      <div class="table-wrap" id="licenses-table">
        <div class="loading"><div class="spinner"></div><br>Loading...</div>
      </div>
    </div>
  </div>
</div>

<script>
  const API = '/api/dashboard';
  let trafficChart = null;

  // --- Auth ---
  const overlay = document.getElementById('auth-overlay');
  const dashboard = document.getElementById('dashboard');
  const pwInput = document.getElementById('auth-password');
  const authError = document.getElementById('auth-error');

  function getToken() { return sessionStorage.getItem('dash_token'); }
  function setToken(t) { sessionStorage.setItem('dash_token', t); }
  function clearToken() { sessionStorage.removeItem('dash_token'); }

  async function authenticate(pw) {
    authError.textContent = '';
    try {
      const res = await fetch(API, { headers: { 'Authorization': `Bearer ${pw}` } });
      if (res.status === 401) {
        authError.textContent = 'Wrong password.';
        return null;
      }
      if (!res.ok) {
        authError.textContent = 'Server error.';
        return null;
      }
      return await res.json();
    } catch {
      authError.textContent = 'Connection failed.';
      return null;
    }
  }

  document.getElementById('auth-submit').addEventListener('click', async () => {
    const pw = pwInput.value.trim();
    if (!pw) return;
    const data = await authenticate(pw);
    if (data) {
      setToken(pw);
      overlay.classList.add('hidden');
      dashboard.classList.remove('hidden');
      render(data);
    }
  });

  pwInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('auth-submit').click();
  });

  document.getElementById('btn-logout').addEventListener('click', () => {
    clearToken();
    dashboard.classList.add('hidden');
    overlay.classList.remove('hidden');
    pwInput.value = '';
    authError.textContent = '';
  });

  document.getElementById('btn-refresh').addEventListener('click', () => loadData());

  async function loadData() {
    const token = getToken();
    if (!token) return;
    try {
      const res = await fetch(API, { headers: { 'Authorization': `Bearer ${token}` } });
      if (res.status === 401) {
        clearToken();
        dashboard.classList.add('hidden');
        overlay.classList.remove('hidden');
        return;
      }
      const data = await res.json();
      render(data);
    } catch {
      // Silently fail on refresh
    }
  }

  // --- Auto-login if token in session ---
  (async () => {
    const token = getToken();
    if (token) {
      const data = await authenticate(token);
      if (data) {
        overlay.classList.add('hidden');
        dashboard.classList.remove('hidden');
        render(data);
        return;
      }
      clearToken();
    }
  })();

  // --- Render ---
  function render(data) {
    renderMetrics(data.totals);
    renderFunnel(data.funnel);
    renderChart(data.timeseries);
    renderSubscribers(data.subscribers);
    renderLicenses(data.licenses);
  }

  function renderMetrics(t) {
    const items = [
      { label: 'Page Views', value: t.page_views },
      { label: 'Downloads', value: t.downloads },
      { label: 'Installs', value: t.installs },
      { label: 'Activations', value: t.activations },
      { label: 'Subscribers', value: t.subscribers },
      { label: 'Purchases', value: t.purchases },
      { label: 'Redpill Clicks', value: t.redpill_clicks },
      { label: 'GitHub Clicks', value: t.github_clicks },
    ];
    document.getElementById('metrics').innerHTML = items.map(m =>
      `<div class="metric">
        <div class="metric-value">${m.value.toLocaleString()}</div>
        <div class="metric-label">${m.label}</div>
      </div>`
    ).join('');
  }

  function renderFunnel(f) {
    const steps = [
      { label: 'Page Views', count: f.page_views },
      { label: 'Redpill Clicks', count: f.redpill_clicks },
      { label: 'Downloads', count: f.downloads },
      { label: 'Purchases', count: f.purchases },
    ];
    const max = Math.max(...steps.map(s => s.count), 1);

    document.getElementById('funnel').innerHTML =
      steps.map(s =>
        `<div class="funnel-row">
          <div class="funnel-label">${s.label}</div>
          <div class="funnel-bar-bg">
            <div class="funnel-bar" style="width: ${(s.count / max * 100).toFixed(1)}%"></div>
          </div>
          <div class="funnel-count">${s.count.toLocaleString()}</div>
        </div>`
      ).join('') +
      `<div class="funnel-conversion">Conversion: <strong>${f.conversion_rate}</strong></div>`;
  }

  function renderChart(ts) {
    const ctx = document.getElementById('traffic-chart').getContext('2d');
    const labels = (ts.page_view || []).map(d => d.date.slice(5));

    if (trafficChart) trafficChart.destroy();

    trafficChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Page Views',
            data: (ts.page_view || []).map(d => d.count),
            borderColor: '#00ff41',
            backgroundColor: 'rgba(0, 255, 65, 0.1)',
            fill: true,
            tension: 0.3,
            pointRadius: 2,
            borderWidth: 2,
          },
          {
            label: 'Downloads',
            data: (ts.download || []).map(d => d.count),
            borderColor: '#ffcc00',
            backgroundColor: 'rgba(255, 204, 0, 0.05)',
            fill: true,
            tension: 0.3,
            pointRadius: 2,
            borderWidth: 2,
          },
          {
            label: 'Redpill Clicks',
            data: (ts.redpill_click || []).map(d => d.count),
            borderColor: '#ff0040',
            backgroundColor: 'rgba(255, 0, 64, 0.05)',
            fill: true,
            tension: 0.3,
            pointRadius: 2,
            borderWidth: 2,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { intersect: false, mode: 'index' },
        plugins: {
          legend: {
            labels: { color: '#4a7a4a', font: { family: "'JetBrains Mono'", size: 11 } }
          },
          tooltip: {
            backgroundColor: 'rgba(0, 10, 0, 0.9)',
            borderColor: 'rgba(0, 255, 65, 0.2)',
            borderWidth: 1,
            titleFont: { family: "'JetBrains Mono'" },
            bodyFont: { family: "'JetBrains Mono'" },
          },
        },
        scales: {
          x: {
            ticks: { color: '#4a7a4a', font: { family: "'JetBrains Mono'", size: 10 } },
            grid: { color: 'rgba(0, 255, 65, 0.05)' },
          },
          y: {
            beginAtZero: true,
            ticks: { color: '#4a7a4a', font: { family: "'JetBrains Mono'", size: 10 } },
            grid: { color: 'rgba(0, 255, 65, 0.05)' },
          },
        },
      },
    });
  }

  function formatDate(iso) {
    if (!iso) return '-';
    return iso.slice(0, 10);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderSubscribers(subs) {
    const el = document.getElementById('subscribers-table');
    if (!subs || subs.length === 0) {
      el.innerHTML = '<div class="empty-state">No subscribers yet</div>';
      return;
    }
    el.innerHTML = `<table>
      <thead><tr><th>Email</th><th>Name</th><th>Source</th><th>Date</th></tr></thead>
      <tbody>${subs.map(s =>
        `<tr>
          <td>${escapeHtml(s.email)}</td>
          <td>${escapeHtml(s.name || '-')}</td>
          <td>${escapeHtml(s.source || '-')}</td>
          <td>${formatDate(s.subscribedAt)}</td>
        </tr>`
      ).join('')}</tbody>
    </table>`;
  }

  function renderLicenses(lics) {
    const el = document.getElementById('licenses-table');
    if (!lics || lics.length === 0) {
      el.innerHTML = '<div class="empty-state">No licenses yet</div>';
      return;
    }
    el.innerHTML = `<table>
      <thead><tr><th>Order</th><th>Email</th><th>Name</th><th>Activations</th><th>Date</th></tr></thead>
      <tbody>${lics.map(l =>
        `<tr>
          <td>${escapeHtml(l.orderId)}</td>
          <td>${escapeHtml(l.email || '-')}</td>
          <td>${escapeHtml(l.buyerName || '-')}</td>
          <td>${l.activationCount}</td>
          <td>${formatDate(l.createdAt)}</td>
        </tr>`
      ).join('')}</tbody>
    </table>`;
  }
</script>
</body>
</html>
